[workspace]
resolver = "3"
members = [
    "crates/gp-atlas-core",
    "crates/gp-atlas-egui",
    "tools/extract-manifest",
    "tests/fake-sf",
    "tests/contract",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/holapancho/gp-atlas"
publish = false

[workspace.dependencies]
gp-atlas-core = { path = "crates/gp-atlas-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
which = "8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
